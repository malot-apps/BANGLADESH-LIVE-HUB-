<!-- File: client/index.html -->
<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>বাংলাদেশ লাইভ হাব | Bangladesh Live Information Hub</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#ef4444',
              green: '#10b981',
              dark: '#0f172a',
              card: '#1e293b'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 select-none" x-data="homeApp()">

  <!-- 1. Top Navigation Bar -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
      <!-- Logo & Title -->
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-red-600 to-emerald-500 p-0.5 shadow-lg shadow-red-500/20">
          <div class="w-full h-full bg-slate-900 rounded-[10px] flex items-center justify-center">
            <span class="text-red-500 font-black text-lg">ব</span>
          </div>
        </div>
        <div>
          <h1 class="font-bold text-base tracking-tight text-white flex items-center gap-1.5 leading-none">
            বাংলাদেশ লাইভ হাব
          </h1>
          <span class="text-[10px] text-emerald-400 font-medium tracking-wide">BD LIVE INFO HUB</span>
        </div>
      </a>

      <!-- Right Header Tools: Weather Pill & Live TV Button -->
      <div class="flex items-center gap-2">
        <!-- Weather Badge -->
        <div class="hidden sm:flex items-center gap-2 bg-slate-800/80 border border-slate-700/60 rounded-full px-3 py-1 text-xs">
          <i data-lucide="cloud-sun" class="w-4 h-4 text-amber-400"></i>
          <span class="font-medium" x-text="weather.district + ' ' + weather.temp"></span>
        </div>

        <!-- Live TV Badge -->
        <a href="tv.html" class="flex items-center gap-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-lg shadow-red-600/30 transition-all transform active:scale-95 pulse-glow">
          <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
          <span>🔴 লাইভ টিভি</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 pt-4 space-y-6">

    <!-- 2. Weather & Location Ticker Card -->
    <section class="glass-card rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 border border-slate-800/80 bg-gradient-to-r from-slate-800/50 via-slate-800/30 to-emerald-950/20">
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <div class="p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl text-amber-400">
          <i data-lucide="sun-medium" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">আজকের আবহাওয়া</span>
            <span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full" x-text="weather.district"></span>
          </div>
          <div class="flex items-baseline gap-2 mt-0.5">
            <span class="text-2xl font-bold text-white" x-text="weather.temp"></span>
            <span class="text-xs text-slate-300" x-text="weather.condition"></span>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between w-full sm:w-auto gap-4 border-t sm:border-t-0 border-slate-700/50 pt-2 sm:pt-0 text-xs text-slate-400">
        <div>
          <span class="block text-[10px] text-slate-500">আর্দ্রতা</span>
          <span class="font-semibold text-slate-200" x-text="weather.humidity"></span>
        </div>
        <div>
          <span class="block text-[10px] text-slate-500">বাতাস</span>
          <span class="font-semibold text-slate-200" x-text="weather.wind"></span>
        </div>
        <button @click="refreshWeather()" class="p-2 hover:bg-slate-700/50 rounded-lg transition-colors text-slate-400 hover:text-white" title="আপডেট করুন">
          <i data-lucide="rotate-cw" class="w-4 h-4"></i>
        </button>
      </div>
    </section>

    <!-- 3. Emergency Public Alerts Section -->
    <section class="space-y-3" x-show="alerts.length > 0">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="alert-triangle" class="w-4 h-4 text-red-500"></i>
          <span>জরুরী সতর্কতা ও নোটিশ</span>
        </h2>
        <span class="text-[11px] text-red-400 font-medium">সরাসরি তথ্য</span>
      </div>

      <div class="space-y-2.5">
        <template x-for="alert in alerts" :key="alert.id">
          <div class="p-4 rounded-xl border bg-red-950/20 border-red-500/30 flex items-start gap-3">
            <div class="p-2 rounded-lg bg-red-500/20 text-red-400 shrink-0 mt-0.5">
              <i data-lucide="bell" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-bold text-red-400 uppercase tracking-wide px-2 py-0.5 bg-red-500/10 rounded-md" x-text="alert.level"></span>
                <span class="text-[10px] text-slate-400" x-text="alert.time"></span>
              </div>
              <h3 class="text-sm font-bold text-slate-100 mt-1" x-text="alert.title"></h3>
              <p class="text-xs text-slate-300 mt-1 leading-relaxed" x-text="alert.desc"></p>
              <div class="mt-2 flex items-center gap-1.5 text-[11px] text-slate-400">
                <i data-lucide="map-pin" class="w-3 h-3 text-emerald-400"></i>
                <span x-text="alert.region"></span>
              </div>
            </div>
          </div>
        </template>
      </div>
    </section>

    <!-- 4. Category Filter Bar -->
    <section class="no-scrollbar overflow-x-auto flex items-center gap-2 py-1">
      <template x-for="cat in categories" :key="cat.id">
        <button 
          @click="activeCategory = cat.id"
          :class="activeCategory === cat.id ? 'bg-red-600 text-white shadow-lg shadow-red-600/20' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700'"
          class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all border border-slate-700/50 flex items-center gap-1.5"
        >
          <span x-text="cat.name"></span>
        </button>
      </template>
    </section>

    <!-- 5. Latest Breaking News Feed -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="newspaper" class="w-4 h-4 text-emerald-400"></i>
          <span>সর্বশেষ সংবাদ</span>
        </h2>
        <span class="text-xs text-slate-400" x-text="filteredNews().length + 'টি সংবাদ'"></span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <template x-for="item in filteredNews()" :key="item.id">
          <article class="glass-card rounded-2xl overflow-hidden group hover:border-slate-700 transition-all">
            <div class="relative h-44 overflow-hidden bg-slate-800">
              <img :src="item.image" :alt="item.titleBn" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
              <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md px-2.5 py-1 rounded-md text-[10px] font-bold text-emerald-400 border border-slate-700">
                <span x-text="item.category"></span>
              </div>
            </div>
            <div class="p-4 space-y-2">
              <div class="flex items-center justify-between text-[11px] text-slate-400">
                <span class="font-medium text-slate-300" x-text="item.source"></span>
                <span x-text="item.time"></span>
              </div>
              <h3 class="text-sm font-bold text-slate-100 group-hover:text-red-400 transition-colors line-clamp-2 leading-snug" x-text="item.titleBn"></h3>
              <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
                <span x-text="item.readTime"></span>
                <button class="text-emerald-400 hover:underline flex items-center gap-1 font-medium">
                  <span>পড়ুন</span>
                  <i data-lucide="arrow-right" class="w-3 h-3"></i>
                </button>
              </div>
            </div>
          </article>
        </template>
      </div>
    </section>

    <!-- 6. Live TV Quick Section -->
    <section class="glass-card rounded-2xl p-5 border border-slate-800 bg-gradient-to-br from-slate-900 via-slate-800/60 to-red-950/20 space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="tv" class="w-5 h-5 text-red-500"></i>
            <span>লাইভ টিভি চ্যানেলসমূহ</span>
          </h2>
          <p class="text-xs text-slate-400 mt-0.5">সবগুলো জনপ্রিয় চ্যানেল একসাথে এক ক্লিকে</p>
        </div>
        <a href="tv.html" class="text-xs font-bold text-red-400 hover:text-red-300 flex items-center gap-1">
          <span>সব দেখুন</span>
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </a>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
        <template x-for="ch in channels" :key="ch.id">
          <a href="tv.html" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 rounded-xl flex flex-col items-center justify-center gap-2 group transition-all">
            <div class="relative w-12 h-12 rounded-lg overflow-hidden bg-slate-900 border border-slate-700 p-1">
              <img :src="ch.logo" :alt="ch.nameBn" class="w-full h-full object-cover rounded" />
              <span class="absolute bottom-0.5 right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
            </div>
            <span class="text-xs font-bold text-slate-200 group-hover:text-red-400 transition-colors text-center" x-text="ch.nameBn"></span>
          </a>
        </template>
      </div>
    </section>

  </main>

  <!-- 7. Mobile Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 py-2 px-6">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <a href="index.html" class="flex flex-col items-center gap-1 text-red-500">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">হোম</span>
      </a>
      <a href="tv.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="tv" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">লাইভ টিভি</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="alert-circle" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">সতর্কতা</span>
      </a>
      <a href="../admin/index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200" title="এডমিন প্যানেল">
        <i data-lucide="shield" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">এডমিন</span>
      </a>
    </div>
  </nav>

  <!-- Alpine App Logic -->
  <script src="main.js"></script>
  <script>
    function homeApp() {
      return {
        weather: window.BDHubData.weather,
        alerts: window.BDHubData.alerts,
        news: window.BDHubData.news,
        channels: window.BDHubData.channels,
        activeCategory: 'all',
        categories: [
          { id: 'all', name: 'সব খবর' },
          { id: 'জাতীয়', name: 'জাতীয়' },
          { id: 'অর্থনীতি', name: 'অর্থনীতি' },
          { id: 'খেলাধুলা', name: 'খেলাধুলা' },
          { id: 'বিনোদন', name: 'বিনোদন' }
        ],
        filteredNews() {
          if (this.activeCategory === 'all') return this.news;
          return this.news.filter(n => n.category === this.activeCategory);
        },
        refreshWeather() {
          this.weather.temp = '৩৩°সে';
          this.weather.updateTime = 'এখনই সংগৃহীত';
        }
      }
    }
  </script>
</body>
</html>
