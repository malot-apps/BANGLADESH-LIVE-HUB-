<!-- File: client/tv.html -->
<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>লাইভ টিভি | বাংলাদেশ লাইভ হাব</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#ef4444',
              green: '#10b981',
              dark: '#0f172a',
              card: '#1e293b'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- HLS.js for Live Stream Playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 select-none" x-data="tvApp()" x-init="initPlayer()">

  <!-- 1. Top Navigation Header -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
      <!-- Back to Home / Logo -->
      <a href="index.html" class="flex items-center gap-2 text-slate-300 hover:text-white transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
        <span class="font-bold text-sm">হোমপেজে ফিরুন</span>
      </a>

      <div class="flex items-center gap-2">
        <span class="px-2.5 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-full text-[11px] font-bold flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
          <span>এইচডি সম্প্রচার</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 pt-4 space-y-6">

    <!-- 2. TV Stream Player Box -->
    <section class="glass-card rounded-2xl overflow-hidden border border-slate-800 shadow-2xl bg-black">
      <div class="relative aspect-video w-full bg-black flex items-center justify-center">
        <!-- Video Element -->
        <video id="tvPlayerVideo" controls playsinline class="w-full h-full object-contain"></video>

        <!-- Watermark / Stream Overlay -->
        <div class="absolute top-4 left-4 z-10 bg-slate-900/80 backdrop-blur-md border border-slate-700/80 px-3 py-1.5 rounded-lg flex items-center gap-2">
          <img :src="activeChannel.logo" class="w-5 h-5 rounded object-cover" />
          <span class="text-xs font-bold text-white" x-text="activeChannel.nameBn"></span>
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        </div>
      </div>

      <!-- Player Controls / Info Bar -->
      <div class="p-4 bg-slate-900 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-t border-slate-800">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-base font-bold text-white" x-text="activeChannel.nameBn"></h2>
            <span class="text-[10px] uppercase font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2 py-0.5 rounded" x-text="activeChannel.category"></span>
          </div>
          <p class="text-xs text-slate-400 mt-0.5" x-text="'লাইভ স্ট্রিমিং - ' + activeChannel.nameEn"></p>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 border-slate-800 pt-2 sm:pt-0">
          <div class="flex items-center gap-1.5 text-xs text-slate-400">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
            <span>ক্লাউডফ্লেয়ার এজ প্রক্সি সক্রিয়</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. Search and Category Filter -->
    <section class="space-y-3">
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
        <!-- Categories -->
        <div class="no-scrollbar overflow-x-auto flex items-center gap-2">
          <template x-for="cat in categories" :key="cat.id">
            <button 
              @click="selectedCategory = cat.id"
              :class="selectedCategory === cat.id ? 'bg-red-600 text-white shadow-lg shadow-red-600/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'"
              class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all border border-slate-700/60"
            >
              <span x-text="cat.name"></span>
            </button>
          </template>
        </div>

        <!-- Search Input -->
        <div class="relative min-w-[220px]">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input 
            type="text" 
            x-model="searchQuery" 
            placeholder="চ্যানেলের নাম খুঁজুন..." 
            class="w-full bg-slate-800 border border-slate-700/80 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-red-500"
          />
        </div>
      </div>
    </section>

    <!-- 4. Channel Grid -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="grid" class="w-4 h-4 text-emerald-400"></i>
          <span>চ্যানেল তালিকা</span>
        </h3>
        <span class="text-xs text-slate-400" x-text="filteredChannels().length + 'টি চ্যানেল উপলব্ধ'"></span>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
        <template x-for="ch in filteredChannels()" :key="ch.id">
          <div 
            @click="switchChannel(ch)"
            :class="activeChannel.id === ch.id ? 'border-red-500 bg-red-950/20 shadow-lg shadow-red-500/10' : 'border-slate-800 bg-slate-800/60 hover:border-slate-700 hover:bg-slate-800'"
            class="p-3.5 rounded-2xl border cursor-pointer transition-all flex flex-col items-center justify-center gap-2.5 text-center group"
          >
            <div class="relative w-14 h-14 rounded-xl overflow-hidden bg-slate-900 border border-slate-700/80 p-1">
              <img :src="ch.logo" :alt="ch.nameBn" class="w-full h-full object-cover rounded-lg group-hover:scale-105 transition-transform" />
              <span class="absolute top-1 right-1 w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-slate-900"></span>
            </div>
            <div>
              <h4 class="text-xs font-bold text-slate-100 group-hover:text-red-400 transition-colors" x-text="ch.nameBn"></h4>
              <span class="text-[10px] text-slate-400 uppercase font-medium mt-0.5 block" x-text="ch.category"></span>
            </div>
          </div>
        </template>
      </div>
    </section>

  </main>

  <!-- 5. Mobile Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 py-2 px-6">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">হোম</span>
      </a>
      <a href="tv.html" class="flex flex-col items-center gap-1 text-red-500">
        <i data-lucide="tv" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">লাইভ টিভি</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="alert-circle" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">সতর্কতা</span>
      </a>
      <a href="../admin/index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200" title="এডমিন প্যানেল">
        <i data-lucide="shield" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">এডমিন</span>
      </a>
    </div>
  </nav>

  <!-- App Logic -->
  <script src="main.js"></script>
  <script>
    function tvApp() {
      return {
        channels: window.BDHubData.channels,
        activeChannel: window.BDHubData.channels[0],
        selectedCategory: 'all',
        searchQuery: '',
        player: null,
        categories: [
          { id: 'all', name: 'সব চ্যানেল' },
          { id: 'news', name: 'সংবাদ' },
          { id: 'sports', name: 'খেলাধুলা' },
          { id: 'entertainment', name: 'বিনোদন' },
          { id: 'islamic', name: 'ইসলামিক' }
        ],
        initPlayer() {
          this.player = new TVStreamPlayer('tvPlayerVideo');
          this.player.loadStream(this.activeChannel.streamUrl);
        },
        switchChannel(channel) {
          this.activeChannel = channel;
          this.player.loadStream(channel.streamUrl);
        },
        filteredChannels() {
          return this.channels.filter(c => {
            const matchesCat = this.selectedCategory === 'all' || c.category === this.selectedCategory;
            const matchesSearch = !this.searchQuery.trim() || 
              c.nameBn.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
              c.nameEn.toLowerCase().includes(this.searchQuery.toLowerCase());
            return matchesCat && matchesSearch;
          });
        }
      }
    }
  </script>
</body>
</html>
